# Render Blueprint（Free Web Service）
# 使用方式：Render Dashboard → New → Blueprint → 連接本 Repo，即自動建立服務。
# 注意：免費方案閒置 15 分鐘會休眠，請以 UptimeRobot 定時 ping `/health` 保持喚醒。
services:
  - type: web
    name: clusdt-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: MARKETAUX_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: "deepseek-flash"
      - key: NEWS_IMPORTANCE_FILTER
        value: "1"
      - key: NEWS_MIN_IMPORTANCE
        value: "6"
      - key: BINANCE_NEWS_ENABLED
        value: "1"
      - key: BINANCE_NEWS_MAX_AGE_HOURS
        value: "12"
      - key: BINANCE_NEWS_LIMIT_PER_CYCLE
        value: "3"
      - key: NEWS_MAX_AGE_MINUTES
        value: "20"
      - key: BINANCE_SYMBOL
        value: "CLUSDT"
      - key: BINANCE_SYMBOLS
        value: "CLUSDT,BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT,LINKUSDT,ENAUSDT,XAUUSDT,XAGUSDT,BNBUSDT,COINUSDT,HOODUSDT,SPCXUSDT,CRCLUSDT,MUUSDT,SNDKUSDT,NVDAUSDT,MSFTUSDT,AAPLUSDT,AMZNUSDT,METAUSDT,GOOGLUSDT,TSLAUSDT"
      - key: ORDERFLOW_BLOCK_USD
        value: "500000"
      - key: ORDERFLOW_WINDOW_USD
        value: "1000000"
      - key: ORDERFLOW_WINDOW_SEC
        value: "15"
      - key: ORDERFLOW_SR_PROXIMITY_PCT
        value: "0.3"
      - key: ORDERFLOW_ATR_MULT
        value: "1.5"
      - key: ORDERFLOW_KLINE_INTERVAL
        value: "1h"
      - key: ORDERFLOW_TP1_ATR_MULT
        value: "3.0"
      - key: ORDERFLOW_TP2_ATR_MULT
        value: "5.0"
      - key: ORDERFLOW_MIN_TP1_PCT
        value: "1.2"
      - key: ORDERFLOW_COOLDOWN_SEC
        value: "900"
      - key: ORDERFLOW_MIN_GAP_SEC
        value: "1800"
      - key: ORDERFLOW_MIN_MOVE_PCT
        value: "0.8"
      - key: ORDERFLOW_SNAPSHOT_MAX_AGE_SEC
        value: "10800"
      - key: ORDERFLOW_ENABLE_MOMENTUM
        value: "1"
      - key: ORDERFLOW_ENABLE_ABSORPTION
        value: "1"
      - key: ORDERFLOW_ENABLE_DIVERGENCE
        value: "1"
      - key: ORDERFLOW_AUTO_CALIBRATE
        value: "1"
      - key: ORDERFLOW_CALIBRATION_FACTOR
        value: "4.5"
      - key: ORDERFLOW_MAX_ALERTS_PER_HOUR
        value: "20"
      - key: ORDERFLOW_MIN_GRADE
        value: "B"
      - key: EQUITY_SYMBOLS
        value: "GOOGL,TSLA,AAPL,MSFT,NVDA,AMZN,META,COIN,HOOD,SPCX,CRCL,MU,SNDK"
      - key: EQUITY_CACHE_TTL_SEC
        value: "21600"
      - key: LOG_LEVEL
        value: "INFO"
      - key: LOOP_INTERVAL_SECONDS
        value: "300"
