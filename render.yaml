        value: "GOOGL,TSLA,AAPL,MSFT,NVDA,AMZN,META,COIN,HOOD,SPCX,CRCL,MU,SNDK"
      - key: EQUITY_CACHE_TTL_SEC
        value: "21600"
      - key: EQUITY_VALUE_TRIGGER_DRAWDOWN_PCT
        value: "25"
      - key: EQUITY_VALUE_TRIGGER_FROM_52W_LOW_PCT
        value: "12"
      - key: LOG_LEVEL
        value: "INFO"
      - key: LOOP_INTERVAL_SECONDS
        value: "300"
