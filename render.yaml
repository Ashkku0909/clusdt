# Render Blueprint（Free Web Service）
# 使用方式：Render Dashboard → New → Blueprint → 連接本 Repo，即自動建立服務。
# 注意：免費方案閒置 15 分鐘會休眠，請以 UptimeRobot 定時 ping `/health` 保持喚醒。
services:
  - type: web
    name: clusdt-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: MARKETAUX_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: "deepseek-flash"
      - key: NEWS_IMPORTANCE_FILTER
        value: "1"
      - key: NEWS_MIN_IMPORTANCE
        value: "6"
      - key: NEWS_VERIFIABLE_TS_ONLY
        value: "1"
      - key: NEWS_HEADLINE_PREFILTER
        value: "1"
      - key: NEWS_SCORE_BEFORE_BODY
        value: "1"
      - key: NEWS_MAX_SCRAPE_PER_CYCLE
        value: "6"
      - key: BINANCE_NEWS_ENABLED
        value: "1"
      - key: BINANCE_NEWS_MAX_AGE_HOURS
        value: "12"
      - key: BINANCE_NEWS_LIMIT_PER_CYCLE
        value: "3"
      - key: NEWS_MAX_AGE_MINUTES
        value: "20"
      - key: BINANCE_SYMBOL
        value: "CLUSDT"
      - key: BINANCE_SYMBOLS
        value: "CLUSDT,BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT,LINKUSDT,ENAUSDT,XAUUSDT,XAGUSDT,BNBUSDT,COINUSDT,HOODUSDT,SPCXUSDT,CRCLUSDT,MUUSDT,SNDKUSDT,NVDAUSDT,MSFTUSDT,AAPLUSDT,AMZNUSDT,METAUSDT,GOOGLUSDT,TSLAUSDT"
      - key: ORDERFLOW_BLOCK_USD
        value: "500000"
      - key: ORDERFLOW_WINDOW_USD
        value: "1000000"
      - key: ORDERFLOW_WINDOW_SEC
        value: "60"
      - key: ORDERFLOW_SR_PROXIMITY_PCT
        value: "0.3"
      - key: ORDERFLOW_ATR_MULT
        value: "1.6"
      - key: ORDERFLOW_ATR_INTERVAL
        value: "4h"
      - key: ORDERFLOW_TP1_ATR_MULT
        value: "1.2"
      - key: ORDERFLOW_TP2_ATR_MULT
        value: "2.4"
      - key: ORDERFLOW_TP3_ATR_MULT
        value: "4.0"
      - key: ORDERFLOW_MIN_TP1_PCT_METALS
        value: "0.55"
      - key: ORDERFLOW_MIN_SL_PCT_METALS
        value: "0.65"
      - key: ORDERFLOW_MIN_TP1_PCT_MAJORS
        value: "0.85"
      - key: ORDERFLOW_MIN_SL_PCT_MAJORS
        value: "1.00"
      - key: ORDERFLOW_MIN_TP1_PCT_ALTS
        value: "1.20"
      - key: ORDERFLOW_MIN_SL_PCT_ALTS
        value: "1.40"
      - key: ORDERFLOW_FLOW_META_TTL_SEC
        value: "3600"
      - key: ORDERFLOW_COOLDOWN_SEC
        value: "7200"
      - key: ORDERFLOW_MIN_GAP_SEC
        value: "2700"
      - key: ORDERFLOW_MIN_MOVE_PCT
        value: "2.5"
      - key: ORDERFLOW_MIN_MOVE_ATR_MULT
        value: "1.5"
      - key: ORDERFLOW_BREAKOUT_CUSHION_ATR
        value: "0.55"
      - key: ORDERFLOW_REQUIRE_CONTEXT
        value: "1"
      - key: ORDERFLOW_CONTEXT_MAX_AGE_SEC
        value: "2700"
      - key: ORDERFLOW_CONTEXT_STAGGER_SEC
        value: "6.0"
      - key: ORDERFLOW_HEAL_INTERVAL_SEC
        value: "8.0"
      - key: ORDERFLOW_TA_REFRESH_SEC
        value: "1800"
      - key: ORDERFLOW_MIN_WINDOW_USD
        value: "250000"
      - key: ORDERFLOW_SNAPSHOT_MAX_AGE_SEC
        value: "10800"
      - key: ORDERFLOW_ENABLE_MOMENTUM
        value: "1"
      - key: ORDERFLOW_ENABLE_ABSORPTION
        value: "1"
      - key: ORDERFLOW_ENABLE_DIVERGENCE
        value: "1"
      - key: ORDERFLOW_ENABLE_VWAP
        value: "1"
      - key: ORDERFLOW_VWAP_WINDOW
        value: "20"
      - key: ORDERFLOW_VWAP_SIGMA_ENTRY
        value: "2.8"
      - key: ORDERFLOW_VWAP_SIGMA_STOP
        value: "1.0"
      - key: ORDERFLOW_VWAP_TREND_MA
        value: "200"
      - key: ORDERFLOW_VWAP_APPROACH_SIGMA
        value: "0.35"
      - key: ORDERFLOW_AUTO_CALIBRATE
        value: "1"
